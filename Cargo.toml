[workspace]
resolver = "2"
members = [
    "anthropic",
    "anthropic-bedrock",
    "anthropic-vertex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/anthropics/anthropic-sdk-rust"
keywords = ["anthropic", "claude", "ai", "llm", "api"]
categories = ["api-bindings", "asynchronous"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

# Async runtime
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
futures = "0.3"

# Utilities
thiserror = "2.0"
derive_builder = "0.20"
url = "2.5"
bytes = "1.5"
pin-project-lite = "0.2"
secrecy = "0.10"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
